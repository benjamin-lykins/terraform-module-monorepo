name: Terraform Module Tests

on:
  pull_request:
    paths:
      - "modules/**"
      - ".github/workflows/terraform-module-tests.yml"
  push:
    paths:
      - "modules/**"
      - ".github/workflows/terraform-module-tests.yml"
  workflow_dispatch:

jobs:
  detect-module-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules_json: ${{ steps.build-matrix.outputs.modules_json }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build matrix from changed modules
        id: build-matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            modules_json=$(find modules -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R . | jq -cs .)
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
              head_sha="${{ github.event.pull_request.head.sha }}"
            else
              base_sha="${{ github.event.before }}"
              head_sha="${{ github.sha }}"
            fi

            # On first push to a branch, GitHub sets event.before to all zeros.
            if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              modules_json=$(find modules -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R . | jq -cs .)
            else
              modules_json=$(git diff --name-only "$base_sha" "$head_sha" | \
                awk -F/ '/^modules\/[^/]+\// { print $2 }' | sort -u | jq -R . | jq -cs .)
            fi
          fi

          if [[ "$modules_json" == "[]" ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi
          echo "modules_json=${modules_json}" >> "$GITHUB_OUTPUT"

  test-modules:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: detect-module-changes
    if: needs.detect-module-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-module-changes.outputs.modules_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=modules/${{ matrix.module }} init -input=false

      - name: Terraform test
        run: terraform -chdir=modules/${{ matrix.module }} test
